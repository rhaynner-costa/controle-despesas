name: Gerar APK Android (Manual)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências NPM
        run: npm ci

      - name: Validar tipagem TypeScript
        run: npm run typecheck

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Release (Standalone)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: controle-despesas-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
